[project]
name = "rigoraudit"
version = "0.1.0"
description = "Audit scientific manuscripts against their code and data for transparency and consistency."
readme = "README.md"
license = "BSD-2-Clause AND MIT"
license-files = ["LICENSE", "src/rigoraudit/katex/LICENSE"]
authors = [
    { name = "Joshua I. Gold", email = "jigold@pennmedicine.upenn.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pypdf>=6.21.4",
    "pypdfium2>=5.14.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
]

[project.scripts]
rigoraudit = "rigoraudit.cli:main"

[project.optional-dependencies]
api = [
    "anthropic>=2.3.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q --tb=short"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
